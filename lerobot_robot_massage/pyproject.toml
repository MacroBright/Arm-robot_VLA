[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_massage"
version = "0.1.0"
description = "LeRobot integration for STM32-mediated Emm_V5 CAN bus massage robotic arm"
requires-python = ">=3.10"
dependencies = [
    "lerobot",
    "pyserial",
    "numpy",
    "opencv-python",
]

[tool.setuptools.packages.find]
include = ["lerobot_robot_massage*"]
